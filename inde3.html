<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌱</span>
                <h1 class="text-xl font-bold text-slate-700 tracking-tight">Focus Portal</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button id="open-add-modal" class="bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium px-4 py-2 rounded-full shadow-sm transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus"></i>
                    <span>追加する</span>
                </button>
                <button id="open-settings-modal" class="text-slate-400 hover:text-slate-600 p-2 rounded-full transition" title="データ管理">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-800">おかえりなさい！(✿︎´ ꒳ ` )</h2>
            <p class="text-sm text-slate-500 mt-1">余計な雑音やコメントを遮断して、モチベーションを高めましょう✨</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-200 mb-6 space-x-6">
            <button id="tab-youtube" class="pb-3 font-medium text-emerald-600 border-b-2 border-emerald-600 transition flex items-center space-x-2">
                <i class="fa-brands fa-youtube text-red-500"></i>
                <span>YouTube 動画</span>
            </button>
            <button id="tab-sns" class="pb-3 font-medium text-slate-400 hover:text-slate-600 transition flex items-center space-x-2">
                <i class="fa-solid fa-compass text-indigo-500"></i>
                <span>SNSショートカット</span>
            </button>
        </div>

        <!-- YouTube Grid View -->
        <section id="section-youtube" class="space-y-4">
            <div id="youtube-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- 動的にカードが入ります -->
            </div>
            <div id="youtube-empty" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                <p class="text-slate-400 mb-2">登録された動画がありません。</p>
                <p class="text-xs text-slate-400">右上「追加する」から好きな勉強動画を追加してください！</p>
            </div>
        </section>

        <!-- SNS Shortcuts View -->
        <section id="section-sns" class="hidden space-y-4">
            <div id="sns-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- 動的にショートカットが入ります -->
            </div>
            <div id="sns-empty" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                <p class="text-slate-400 mb-2">ショートカットが追加されていません。</p>
                <p class="text-xs text-slate-400">InstagramやTikTokなどの勉強垢リンクを追加してみましょう！</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-100">
        Focus Portal - ノイズレスに自分の目標へ集中しよう
    </footer>

    <!-- Add Modal -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">お気に入り追加</h3>
                <button id="close-add-modal" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="add-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">種類</label>
                    <select id="item-type" class="w-full border border-slate-200 rounded-xl p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                        <option value="youtube">YouTube動画</option>
                        <option value="sns">SNSリンク (Instagram / TikTok / その他)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">タイトル (例: 1日勉強Vlog)</label>
                    <input type="text" id="item-title" required class="w-full border border-slate-200 rounded-xl p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="タイトルを入力">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">URL (YouTube動画URL または 各種SNSリンク)</label>
                    <input type="url" id="item-url" required class="w-full border border-slate-200 rounded-xl p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="https://...">
                    <p class="text-[10px] text-slate-400 mt-1">※YouTubeは通常の動画URLやシェア用URLでOKです</p>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 rounded-xl transition shadow-sm text-sm">
                    追加する
                </button>
            </form>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="player-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-black rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl relative flex flex-col aspect-video">
            <button id="close-player-modal" class="absolute top-3 right-3 bg-white/20 hover:bg-white/40 text-white w-9 h-9 rounded-full flex items-center justify-center transition z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="player-container" class="w-full h-full flex items-center justify-center">
                <!-- iframeが入ります -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">データ管理</h3>
                <button id="close-settings-modal" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-2">
                <button id="reset-data" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-2 rounded-xl transition text-sm border border-rose-200">
                    初期データに戻す
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const defaultYoutube = [
            { id: '1', title: '【勉強Vlog】集中力を高める一日ルーティン', url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
            { id: '2', title: '試験合格のための効率的な暗記術まとめ', url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' }
        ];
        const defaultSns = [
            { id: '1', title: 'お気に入り勉強垢 (Instagram)', url: 'https://instagram.com' },
            { id: '2', title: 'モチベUP勉強系TikTok', url: 'https://tiktok.com' }
        ];

        let youtubeList = JSON.parse(localStorage.getItem('focus_youtube')) || defaultYoutube;
        let snsList = JSON.parse(localStorage.getItem('focus_sns')) || defaultSns;

        const youtubeGrid = document.getElementById('youtube-grid');
        const youtubeEmpty = document.getElementById('youtube-empty');
        const snsGrid = document.getElementById('sns-grid');
        const snsEmpty = document.getElementById('sns-empty');

        const tabYoutube = document.getElementById('tab-youtube');
        const tabSns = document.getElementById('tab-sns');
        const sectionYoutube = document.getElementById('section-youtube');
        const sectionSns = document.getElementById('section-sns');

        const addModal = document.getElementById('add-modal');
        const playerModal = document.getElementById('player-modal');
        const settingsModal = document.getElementById('settings-modal');
        const playerContainer = document.getElementById('player-container');

        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function render() {
            youtubeGrid.innerHTML = '';
            if (youtubeList.length === 0) {
                youtubeEmpty.classList.remove('hidden');
            } else {
                youtubeEmpty.classList.add('hidden');
                youtubeList.forEach(item => {
                    const ytId = getYouTubeId(item.url);
                    const thumbUrl = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60';
                    
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition border border-slate-100 flex flex-col group cursor-pointer relative';
                    card.innerHTML = `
                        <div class="relative aspect-video bg-slate-100 overflow-hidden">
                            <img src="${thumbUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition flex items-center justify-center">
                                <div class="w-10 h-10 rounded-full bg-white/90 text-slate-800 flex items-center justify-center shadow-lg opacity-80 group-hover:opacity-100 group-hover:scale-110 transition">
                                    <i class="fa-solid fa-play ml-0.5"></i>
                                </div>
                            </div>
                        </div>
                        <div class="p-3.5 flex justify-between items-start">
                            <h4 class="font-medium text-sm text-slate-700 line-clamp-2">${item.title}</h4>
                            <button class="delete-btn text-slate-300 hover:text-rose-500 p-1 transition" data-id="${item.id}" data-type="youtube" title="削除">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.delete-btn')) return;
                        if (ytId) {
                            playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                            playerModal.classList.remove('hidden');
                        } else {
                            window.open(item.url, '_blank');
                        }
                    });
                    youtubeGrid.appendChild(card);
                });
            }

            snsGrid.innerHTML = '';
            if (snsList.length === 0) {
                snsEmpty.classList.remove('hidden');
            } else {
                snsEmpty.classList.add('hidden');
                snsList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-4 shadow-sm hover:shadow-md transition border border-slate-100 flex items-center justify-between group cursor-pointer';
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-link"></i>
                            </div>
                            <span class="font-medium text-sm text-slate-700 truncate">${item.title}</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button class="delete-btn text-slate-300 hover:text-rose-500 p-2 transition" data-id="${item.id}" data-type="sns" title="削除">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                        </div>
                    `;
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.delete-btn')) return;
                        window.open(item.url, '_blank');
                    });
                    snsGrid.appendChild(card);
                });
            }

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const type = btn.getAttribute('data-type');
                    if (type === 'youtube') {
                        youtubeList = youtubeList.filter(i => i.id !== id);
                        localStorage.setItem('focus_youtube', JSON.stringify(youtubeList));
                    } else {
                        snsList = snsList.filter(i => i.id !== id);
                        localStorage.setItem('focus_sns', JSON.stringify(snsList));
                    }
                    render();
                });
            });
        }

        tabYoutube.addEventListener('click', () => {
            tabYoutube.className = "pb-3 font-medium text-emerald-600 border-b-2 border-emerald-600 transition flex items-center space-x-2";
            tabSns.className = "pb-3 font-medium text-slate-400 hover:text-slate-600 transition flex items-center space-x-2";
            sectionYoutube.classList.remove('hidden');
            sectionSns.classList.add('hidden');
        });

        tabSns.addEventListener('click', () => {
            tabSns.className = "pb-3 font-medium text-emerald-600 border-b-2 border-emerald-600 transition flex items-center space-x-2";
            tabYoutube.className = "pb-3 font-medium text-slate-400 hover:text-slate-600 transition flex items-center space-x-2";
            sectionSns.classList.remove('hidden');
            sectionYoutube.classList.add('hidden');
        });

        document.getElementById('open-add-modal').addEventListener('click', () => addModal.classList.remove('hidden'));
        document.getElementById('close-add-modal').addEventListener('click', () => addModal.classList.add('hidden'));
        document.getElementById('open-settings-modal').addEventListener('click', () => settingsModal.classList.remove('hidden'));
        document.getElementById('close-settings-modal').addEventListener('click', () => settingsModal.classList.add('hidden'));

        document.getElementById('close-player-modal').addEventListener('click', () => {
            playerModal.classList.add('hidden');
            playerContainer.innerHTML = '';
        });

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('item-type').value;
            const title = document.getElementById('item-title').value;
            const url = document.getElementById('item-url').value;
            const newItem = { id: Date.now().toString(), title, url };

            if (type === 'youtube') {
                youtubeList.push(newItem);
                localStorage.setItem('focus_youtube', JSON.stringify(youtubeList));
            } else {
                snsList.push(newItem);
                localStorage.setItem('focus_sns', JSON.stringify(snsList));
            }

            addModal.classList.add('hidden');
            document.getElementById('add-form').reset();
            render();
        });

        document.getElementById('reset-data').addEventListener('click', () => {
            if (confirm('データを初期状態に戻しますか？')) {
                localStorage.removeItem('focus_youtube');
                localStorage.removeItem('focus_sns');
                youtubeList = defaultYoutube;
                snsList = defaultSns;
                settingsModal.classList.add('hidden');
                render();
            }
        });

        render();
    </script>
</body>
</html>
